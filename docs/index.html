<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📋 HKO 工時表系統</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-app: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-subtle: #f8fafc;
            --border-color: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --primary: #1e4a76;
            --primary-hover: #163759;
            --primary-soft: #eff6ff;
            --emerald: #059669;
            --emerald-hover: #047857;
            --violet: #7c3aed;
            --violet-hover: #6d28d9;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-pill: 9999px;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background: linear-gradient(180deg, #e2e8f0 0%, var(--bg-app) 220px);
            color: var(--text-primary);
            margin: 0;
            padding: 20px 16px 88px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1560px;
            margin: 0 auto;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(226, 232, 240, 0.9);
            padding: 24px 28px 32px;
        }

        /* Header */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 18px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #2b6cb0);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(30, 74, 118, 0.25);
        }

        .brand-title h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .account-panel {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            font-size: 0.8rem;
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid #dbeafe;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
        }

        .status-dot.pending {
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
        }

        .status-dot.off {
            background: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
        }

        /* Navigation Tabs */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .tab-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-right: 4px;
            min-width: 36px;
        }

        .year-tab,
        .month-tab {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.16s ease;
            font-size: 0.84rem;
        }

        .year-tab:hover:not(:disabled),
        .month-tab:hover:not(:disabled) {
            background: #e2e8f0;
            color: var(--text-primary);
        }

        .year-tab.active,
        .month-tab.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 6px rgba(30, 74, 118, 0.25);
        }

        .month-tab:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Toolbar & Buttons */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 18px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background: #eef2ff;
            color: var(--text-primary);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.84rem;
            transition: all 0.16s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #e2e8f0 !important;
            color: #94a3b8 !important;
            border-color: transparent !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
        }

        .btn-outline:hover:not(:disabled) {
            background: #f1f5f9;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--danger-hover);
        }

        .btn-csv {
            background: var(--emerald);
            color: white;
        }

        .btn-csv:hover:not(:disabled) {
            background: var(--emerald-hover);
        }

        .btn-pdf {
            background: var(--violet);
            color: white;
        }

        .btn-pdf:hover:not(:disabled) {
            background: var(--violet-hover);
        }

        /* Summary KPI Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .kpi-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .kpi-label {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .kpi-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .kpi-value.positive {
            color: var(--emerald);
        }

        .kpi-value.negative {
            color: var(--danger);
        }

        /* Table */
        .month-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .month-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .legend-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.74rem;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 68vh;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.84rem;
            min-width: 1240px;
        }

        th,
        td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 9px 8px;
            text-align: center;
            vertical-align: middle;
        }

        th:last-child,
        td:last-child {
            border-right: none;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f1f5f9;
            color: var(--text-primary);
            font-weight: 700;
            white-space: nowrap;
            border-bottom: 2px solid var(--border-strong);
        }

        tbody tr {
            transition: filter 0.12s ease;
        }

        tbody tr:hover {
            filter: brightness(0.975);
        }

        input.time-input {
            width: 104px;
            padding: 6px 6px;
            text-align: center;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.84rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input.time-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 74, 118, 0.15);
        }

        input.time-input:disabled {
            background: rgba(241, 245, 249, 0.7);
            color: var(--text-muted);
            border-color: transparent;
            cursor: not-allowed;
        }

        .leave-checkbox {
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0 4px;
        }

        .leave-checkbox:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .readonly-cell {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        /* Semantic Row Backgrounds */
        .data-present-row {
            background-color: #f0fdf4;
        }

        .missing-data-row {
            background-color: #fff7ed;
        }

        .weekend-row {
            background-color: #eef2ff;
        }

        .public-holiday-row {
            background-color: #fef2f2;
        }

        .am-leave-row,
        .pm-leave-row,
        .full-day-off-row {
            background-color: #fffbeb;
        }

        .special-arrangement-row {
            background-color: #fff1f2;
        }

        .historical-row {
            background-color: #f8fafc;
            color: var(--text-muted);
        }

        .future-row {
            background-color: #ffffff;
        }

        .footer-row td {
            position: sticky;
            bottom: 0;
            z-index: 9;
            background: #e0f2fe;
            color: var(--primary);
            font-weight: 700;
            border-top: 2px solid var(--primary);
            border-bottom: none;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-left: 6px;
            white-space: nowrap;
        }

        .badge-weekend {
            background: #4f46e5;
            color: white;
        }

        .badge-public {
            background: #dc2626;
            color: white;
        }

        .badge-am-leave,
        .badge-pm-leave,
        .badge-full-off {
            background: #d97706;
            color: white;
        }

        .badge-special {
            background: #e11d48;
            color: white;
        }

        .badge-data {
            background: #16a34a;
            color: white;
        }

        .badge-missing {
            background: #ea580c;
            color: white;
        }

        .badge-historical {
            background: #64748b;
            color: white;
        }

        .badge-future {
            background: #2563eb;
            color: white;
        }

        /* Floating Pending Changes Bar */
        .pending-changes {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background: #0f172a;
            color: white;
            padding: 10px 14px 10px 20px;
            border-radius: var(--radius-pill);
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.86rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: slideUp 0.2s ease-out;
        }

        .pending-changes button {
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        #savePendingBtn {
            background: #22c55e;
            color: #052e16;
        }

        #cancelPendingBtn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Rectifying Editor */
        .rectifying-editor {
            margin-top: 16px;
            padding: 14px 18px;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85rem;
        }

        .rectifying-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rectifying-controls input {
            width: 96px;
            padding: 6px 10px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 2.2rem 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-card h3 {
            margin: 0 0 6px;
            font-size: 1.3rem;
            color: var(--text-primary);
        }

        .login-card p {
            margin: 0 0 18px;
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .login-card input {
            width: 100%;
            padding: 11px 16px;
            margin: 6px 0;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-pill);
            font-size: 0.92rem;
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 74, 118, 0.15);
        }

        .login-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .login-card button {
            flex: 1;
            padding: 11px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .login-card button.secondary {
            background: #e2e8f0;
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px 10px 88px;
            }

            .container {
                padding: 16px 14px 24px;
                border-radius: 16px;
            }

            input.time-input {
                width: 84px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-section">
            <div class="brand-title">
                <div class="brand-icon">📋</div>
                <div>
                    <h1>HKO 工時表系統</h1>
                    <div class="brand-subtitle">每日出勤紀錄、工時差額計算與報表匯出</div>
                </div>
            </div>
            <div class="account-panel">
                <div class="user-info" id="userInfo">未登入</div>
                <div class="status">
                    <span class="status-dot pending" id="statusDot"></span>
                    <span id="statusText">等待登入</span>
                </div>
                <button id="logoutBtn" class="btn btn-danger" style="display:none;">🚪 登出</button>
            </div>
        </div>

        <div class="nav-section">
            <div class="tab-bar" id="yearTabs"></div>
            <div class="tab-bar" id="monthTabs"></div>
        </div>

        <div class="toolbar">
            <div class="btn-group">
                <button class="btn btn-primary" id="consentBtn" disabled>🔒 同意並啟用儲存</button>
                <button class="btn btn-outline" id="refreshBtn" disabled>🔄 重新整理</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-csv" id="exportCsvBtn" disabled>📄 匯出 CSV</button>
                <button class="btn btn-pdf" id="exportPdfBtn" disabled>📑 匯出 PDF 報表</button>
            </div>
        </div>

        <div id="tableContainer">
            <div class="empty-state">🔐 請先登入您的帳號以載入工時表</div>
        </div>
    </div>

    <div id="pendingBar" class="pending-changes" style="display:none;">
        <span>⚡ 有 <strong id="pendingCount">0</strong> 筆未儲存修改</span>
        <button id="savePendingBtn">💾 儲存</button>
        <button id="cancelPendingBtn">✖️ 取消</button>
    </div>

    <div id="loginOverlay" class="login-overlay" style="display:none;">
        <div class="login-card">
            <h3>🔐 登入 HKO 工時表</h3>
            <p>請輸入 Firebase 驗證電郵與密碼</p>
            <input type="email" id="loginEmail" placeholder="電郵地址 (例如: name@hko.gov.hk)" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password">
            <div class="login-actions">
                <button id="loginSubmitBtn">登入</button>
                <button id="registerSubmitBtn" class="secondary">註冊新帳號</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, get, set } from "firebase/database";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

        let loadingSwal = null;
        function showLoadingBlocking(msg) {
            if (loadingSwal) { loadingSwal.update({ title: msg }); return; }
            loadingSwal = Swal.fire({
                title: msg,
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                didOpen: () => Swal.showLoading()
            });
        }
        async function hideLoadingBlocking() {
            if (loadingSwal) { await loadingSwal.close(); loadingSwal = null; }
        }
        async function withBlockingLoading(op, msg) {
            showLoadingBlocking(msg);
            try {
                const res = await op();
                await hideLoadingBlocking();
                return res;
            } catch (e) {
                await hideLoadingBlocking();
                throw e;
            }
        }
        function showToast(msg, isErr = false) {
            Swal.fire({
                icon: isErr ? 'error' : 'success',
                title: msg,
                toast: true,
                position: 'bottom-end',
                showConfirmButton: false,
                timer: 2400
            });
        }

        function timeToMin(t) {
            if (!t || typeof t !== 'string' || !t.includes(':')) return 0;
            const [h, m] = t.split(':').map(Number);
            return (isNaN(h) || isNaN(m)) ? 0 : h * 60 + m;
        }
        function minToTime(min) {
            const absMin = Math.abs(min);
            const hours = Math.floor(absMin / 60);
            const minutes = absMin % 60;
            const sign = min < 0 ? '-' : '';
            return `${sign}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
        }
        function formatTimeDisplay(t) {
            if (!t || t === "00:00") return "—";
            return t;
        }
        function getExpectedWH(weekday, isAmOff, isPmOff) {
            const isWeekend = (weekday === '週六' || weekday === '週日');
            if (isWeekend) return "00:00";
            const isFriday = (weekday === '週五');
            const base = isFriday ? "07:40" : "07:50";
            if (isAmOff && isPmOff) return "00:00";
            if (isAmOff) return "04:20";
            if (isPmOff) return isFriday ? "03:25" : "03:35";
            return base;
        }
        function calcExpectedOff(t1, expWH, t2, t3) {
            if (!t1 || expWH === "00:00") return "—";
            const startMin = timeToMin(t1);
            const workMin = timeToMin(expWH);
            const lunchBreak = Math.max(0, timeToMin(t3) - timeToMin(t2));
            return minToTime(startMin + workMin + lunchBreak);
        }
        function calcActualWork(t1, t2, t3, t4, isAmOff, isPmOff) {
            if (isAmOff && isPmOff) return "00:00";
            if (isAmOff && !isPmOff) {
                const t3Min = timeToMin(t3), t4Min = timeToMin(t4);
                if (t3 && t4 && t3Min > 0 && t4Min > 0) return minToTime(Math.max(0, t4Min - t3Min));
                return null;
            }
            if (!isAmOff && isPmOff) {
                const t1Min = timeToMin(t1), t2Min = timeToMin(t2);
                if (t1 && t2 && t1Min > 0 && t2Min > 0) return minToTime(Math.max(0, t2Min - t1Min));
                return null;
            }
            if (!t1 || !t2 || !t3 || !t4) return null;
            const afternoon = timeToMin(t4) - timeToMin(t3);
            const morning = timeToMin(t2) - timeToMin(t1);
            if (afternoon <= 0 || morning <= 0) return null;
            return minToTime(morning + afternoon);
        }
        function getHolidayType(weekday, isPublic, isAmOff, isPmOff, hasSpecial) {
            const isWeekend = (weekday === '週六' || weekday === '週日');
            if (isWeekend) return 'weekend';
            if (isPublic) return 'public';
            if (hasSpecial) return 'special';
            if (isAmOff && isPmOff) return 'full-day-off';
            if (isAmOff) return 'am-off';
            if (isPmOff) return 'pm-off';
            return 'none';
        }

        function getTodayUTC8() {
            const now = new Date();
            const off = now.getTimezoneOffset();
            const utc8 = new Date(now.getTime() + (off + 480) * 60000);
            return new Date(utc8.getFullYear(), utc8.getMonth(), utc8.getDate());
        }
        const TODAY_UTC8 = getTodayUTC8();
        const START_DATE = new Date(2025, 6, 11);
        const END_DATE = new Date(TODAY_UTC8.getFullYear(), TODAY_UTC8.getMonth() + 1, 0);

        function isMonthDisabled(year, month) {
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            return !(first <= END_DATE && last >= START_DATE);
        }

        let currentYear = TODAY_UTC8.getFullYear();
        let currentMonth = TODAY_UTC8.getMonth();
        if (isMonthDisabled(currentYear, currentMonth)) {
            for (let y = currentYear; y >= START_DATE.getFullYear(); y--) {
                for (let m = 11; m >= 0; m--) {
                    if (!isMonthDisabled(y, m)) { currentYear = y; currentMonth = m; break; }
                }
            }
        }

        async function loadPublicHolidays(year) {
            try {
                const snap = await get(ref(db, `holiday/${year}`));
                return snap.exists() ? new Set(snap.val()) : new Set();
            } catch (e) { return new Set(); }
        }
        async function loadDayOffMap(year, mapKey) {
            if (!USER) return new Map();
            const res = new Map();
            try {
                const snap = await get(ref(db, `timesheet/${USER}/${year}`));
                if (snap.exists()) {
                    for (const mon in snap.val()) {
                        for (const day in snap.val()[mon]) {
                            if (snap.val()[mon][day][mapKey] === true) res.set(`${year}-${mon}-${day}`, true);
                        }
                    }
                }
            } catch (e) { }
            return res;
        }
        async function loadSpecialRemarks(year) {
            if (!USER) return new Map();
            const map = new Map();
            try {
                const snap = await get(ref(db, `timesheet/${USER}/${year}`));
                if (snap.exists()) {
                    for (const mon in snap.val()) {
                        for (const day in snap.val()[mon]) {
                            const r = snap.val()[mon][day]?.remark;
                            if (r && typeof r === 'string' && r.trim() !== '') map.set(`${year}-${mon}-${day}`, r);
                        }
                    }
                }
            } catch (e) { }
            return map;
        }

        async function loadMonthData(year, month) {
            if (!isAuthenticated || !USER) return [];
            const monthStr = (month + 1).toString().padStart(2, '0');
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const rows = [];
            const [publicHolidays, amOffMap, pmOffMap, specialMap] = await Promise.all([
                loadPublicHolidays(year),
                loadDayOffMap(year, 'isAmOff'),
                loadDayOffMap(year, 'isPmOff'),
                loadSpecialRemarks(year)
            ]);

            for (let d = 1; d <= daysInMonth; d++) {
                const dayStr = d.toString().padStart(2, '0');
                const dateStr = `${year}-${monthStr}-${dayStr}`;
                const weekday = new Date(year, month, d).toLocaleDateString('zh-TW', { weekday: 'short' });
                const dayPath = `timesheet/${USER}/${year}/${monthStr}/${dayStr}`;
                let snap = null;
                try { snap = await get(ref(db, dayPath)); } catch (e) { }
                const dayData = snap?.exists() ? snap.val() : null;

                const isPublic = publicHolidays.has(dateStr);
                const baseAmOff = amOffMap.has(dateStr);
                const basePmOff = pmOffMap.has(dateStr);
                const baseRemark = specialMap.get(dateStr) || null;
                const hasSpecialRemark = !!(baseRemark && baseRemark.trim() !== '');

                let times = { time1: null, time2: null, time3: null, time4: null };
                let hasDataInFirebase = false;
                let isAmOff = baseAmOff, isPmOff = basePmOff, remark = baseRemark;

                if (dayData) {
                    times = {
                        time1: dayData.time1 ?? null,
                        time2: dayData.time2 ?? null,
                        time3: dayData.time3 ?? null,
                        time4: dayData.time4 ?? null
                    };
                    hasDataInFirebase = true;
                    if (dayData.isAmOff !== undefined) isAmOff = dayData.isAmOff;
                    if (dayData.isPmOff !== undefined) isPmOff = dayData.isPmOff;
                    if (dayData.remark) remark = dayData.remark;
                }

                const holidayType = getHolidayType(weekday, isPublic, isAmOff, isPmOff, hasSpecialRemark);
                const expectedWH = getExpectedWH(weekday, isAmOff, isPmOff);
                const expectedOff = calcExpectedOff(times.time1, expectedWH, times.time2, times.time3);
                const actualWork = calcActualWork(times.time1, times.time2, times.time3, times.time4, isAmOff, isPmOff);
                const cellDate = new Date(year, month, d);
                const dateStatus = (cellDate > TODAY_UTC8) ? 'future' : (cellDate < START_DATE ? 'historical' : 'editable');
                const isEditable = (dateStatus === 'editable' && !['weekend', 'public', 'special'].includes(holidayType) && !hasSpecialRemark);

                rows.push({
                    date: dateStr,
                    weekday,
                    times,
                    isAmOff,
                    isPmOff,
                    holidayType,
                    hasDataInFirebase,
                    expectedWH,
                    expectedOff,
                    actualWork,
                    isEditable,
                    dateStatus,
                    hasSpecialRemark,
                    remark
                });
            }
            currentTableData = rows;
            return rows;
        }

        function computeCumulativeDifference() {
            let totalExpected = 0, totalActual = 0;
            for (const row of currentTableData) {
                if (row.dateStatus !== 'editable') continue;
                if (["weekend", "public", "special", "full-day-off"].includes(row.holidayType)) continue;
                totalExpected += timeToMin(row.expectedWH);
                let actMin = 0;
                if (row.actualWork && row.actualWork !== "00:00") actMin = timeToMin(row.actualWork);
                totalActual += actMin;
            }
            return totalExpected - totalActual;
        }

        async function saveCumulativeDiffToFirebase(diffMin) {
            if (!USER || !userConsented) return;
            const monthStr = (currentMonth + 1).toString().padStart(2, '0');
            const offsetRef = ref(db, `offset/${USER}/${currentYear}/${monthStr}`);
            let existingFactor = 0;
            try {
                const snap = await get(offsetRef);
                if (snap.exists()) existingFactor = snap.val().rectifyingFactor || 0;
            } catch (e) { }
            await set(offsetRef, {
                differenceMinutes: diffMin,
                differenceFormatted: `${diffMin < 0 ? "已加班" : "需補班"} ${minToTime(Math.abs(diffMin))}`,
                rectifyingFactor: existingFactor,
                lastUpdated: new Date().toISOString()
            });
        }

        async function getRectifyingFactor(year, month) {
            if (!USER) return 0;
            try {
                const snap = await get(ref(db, `offset/${USER}/${year}/${(month + 1).toString().padStart(2, '0')}`));
                return snap.exists() ? snap.val().rectifyingFactor || 0 : 0;
            } catch (e) { return 0; }
        }

        async function setRectifyingFactor(year, month, factor) {
            if (!USER || !userConsented) {
                showToast("請先點擊「同意並啟用儲存」", true);
                return;
            }
            const path = `offset/${USER}/${year}/${(month + 1).toString().padStart(2, '0')}`;
            const snap = await get(ref(db, path));
            const existing = snap.exists() ? snap.val() : {};
            await set(ref(db, path), { ...existing, rectifyingFactor: factor, lastUpdated: new Date().toISOString() });
        }

        async function calculateTotalCumulativeDiffFromJul2025() {
            if (!USER) return 0;
            let total = 0;
            for (let y = 2025; y <= currentYear; y++) {
                for (let m = (y === 2025 ? 6 : 0); m <= (y === currentYear ? currentMonth : 11); m++) {
                    try {
                        const snap = await get(ref(db, `offset/${USER}/${y}/${(m + 1).toString().padStart(2, '0')}`));
                        if (snap.exists()) {
                            const data = snap.val();
                            total += (data.differenceMinutes || 0) + (data.rectifyingFactor || 0);
                        }
                    } catch (e) { }
                }
            }
            return total;
        }

        function getEffectiveRow(row) {
            const pending = pendingChanges.get(row.date);
            if (!pending) return row;
            const merged = {
                ...row,
                times: { ...row.times, ...(pending.times || {}) },
                isAmOff: pending.isAmOff !== undefined ? pending.isAmOff : row.isAmOff,
                isPmOff: pending.isPmOff !== undefined ? pending.isPmOff : row.isPmOff,
                remark: pending.remark !== undefined ? pending.remark : row.remark
            };
            merged.holidayType = getHolidayType(
                merged.weekday,
                row.holidayType === 'public',
                merged.isAmOff,
                merged.isPmOff,
                !!(merged.remark && merged.remark.trim() !== '')
            );
            merged.expectedWH = getExpectedWH(merged.weekday, merged.isAmOff, merged.isPmOff);
            merged.expectedOff = calcExpectedOff(merged.times.time1, merged.expectedWH, merged.times.time2, merged.times.time3);
            merged.actualWork = calcActualWork(merged.times.time1, merged.times.time2, merged.times.time3, merged.times.time4, merged.isAmOff, merged.isPmOff);
            return merged;
        }

        function stageRowChange(dateStr, updater) {
            const baseRow = currentTableData.find(r => r.date === dateStr);
            if (!baseRow) return;

            pendingChanges.set(dateStr, {

        function getRowClass(row) {
            if (row.dateStatus === 'historical') return 'historical-row';

            switch (row.holidayType) {
                case 'weekend': return 'weekend-row';

                case 'full-day-off': return 'full-day-off-row';

                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="rectifying-editor">
                    <div>
                        <strong>⚖️ 本月工時修正值 (分鐘)：</strong>
                        <span style="color:var(--text-muted);">正數代表增加應補分鐘，負數代表扣減</span>
                    </div>
                    <div class="rectifying-controls">
                        <input type="number" id="rectifyInput" value="${cachedRectifyingFactor}" step="5">
                        <button class="btn btn-outline" id="saveRectifyBtn">套用修正值</button>
                    </div>
                </div>
            `;

            // Bind row inputs
            tableContainer.querySelectorAll('tr[data-date]').forEach(tr => {
                const dateStr = tr.getAttribute('data-date');
                tr.querySelectorAll('input.time-input').forEach(inp => {
                    inp.addEventListener('change', (e) => {
                        const field = e.target.getAttribute('data-field');
                        const val = e.target.value || null;
                        stageRowChange(dateStr, row => ({
                            ...row,
                            times: { ...row.times, [field]: val }
                        }));
                    });
                });

                const amCb = tr.querySelector('.am-off-cb');
                const pmCb = tr.querySelector('.pm-off-cb');
                if (amCb) {
                    amCb.addEventListener('change', (e) => {
                        stageRowChange(dateStr, row => ({ ...row, isAmOff: e.target.checked }));
                    });
                }
                if (pmCb) {
                    pmCb.addEventListener('change', (e) => {
                        stageRowChange(dateStr, row => ({ ...row, isPmOff: e.target.checked }));
                    });
                }
            });

            const saveRectifyBtn = document.getElementById('saveRectifyBtn');
            if (saveRectifyBtn) {
                saveRectifyBtn.addEventListener('click', async () => {
                    const val = parseInt(document.getElementById('rectifyInput').value, 10) || 0;
                    await withBlockingLoading(async () => {
                        await setRectifyingFactor(currentYear, currentMonth, val);
                        cachedRectifyingFactor = val;
                        cachedTotalDiff = await calculateTotalCumulativeDiffFromJul2025();
                        renderTableOnly();
                    }, '儲存工時修正值...');
                    showToast('已更新本月修正值');
                });
            }
        }

        async function refreshAll() {
            if (!isAuthenticated || !USER) return;
            await withBlockingLoading(async () => {
                await loadMonthData(currentYear, currentMonth);
                const diffMin = computeCumulativeDifference();
                if (userConsented) {
                    await saveCumulativeDiffToFirebase(diffMin);
                }
                cachedRectifyingFactor = await getRectifyingFactor(currentYear, currentMonth);
                cachedTotalDiff = await calculateTotalCumulativeDiffFromJul2025();
                renderTableOnly();
            }, '載入工時資料...');
        }

        // ========== CSV 匯出 ==========
        function escapeCsvCell(value) {
            const str = value === null || value === undefined ? '' : String(value);
            if (/[",\r\n]/.test(str)) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function exportToCSV() {
            if (!USER) {
                showToast("請先登入", true);
                return;
            }
            if (!currentTableData || currentTableData.length === 0) {
                showToast("目前沒有可匯出的資料", true);
                return;
            }

            const holidayLabels = {
                'none': '正常工作日',
                'weekend': '週末',
                'public': '公眾假期',
                'special': '特別安排',
                'full-day-off': '全日休假',
                'am-off': '上午假',
                'pm-off': '下午假'
            };

            const headers = [
                "日期",
                "星期",
                "假別/狀態",
                "上午假",
                "下午假",
                "上班 1",
                "下班 1",
                "上班 2",
                "下班 2",
                "應做工時",
                "預計下班",
                "實際工時",
                "備註"
            ];

            const lines = [headers.map(escapeCsvCell).join(",")];
            const effectiveRows = currentTableData.map(getEffectiveRow);

            for (const row of effectiveRows) {
                const csvRow = [
                    row.date,
                    row.weekday,
                    holidayLabels[row.holidayType] || row.holidayType,
                    row.isAmOff ? "是" : "否",
                    row.isPmOff ? "是" : "否",
                    row.times?.time1 ?? "",
                    row.times?.time2 ?? "",
                    row.times?.time3 ?? "",
                    row.times?.time4 ?? "",
                    row.expectedWH ?? "",
                    row.expectedOff ?? "",
                    row.actualWork ?? "",
                    row.remark ?? ""
                ];
                lines.push(csvRow.map(escapeCsvCell).join(","));
            }

            const monthStr = (currentMonth + 1).toString().padStart(2, '0');
            const csvContent = "\uFEFF" + lines.join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = `HKO_Timesheet_${currentYear}-${monthStr}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`已匯出 ${currentYear}-${monthStr} CSV`);
        }

        // ========== PDF 報表列印匯出 ==========
        async function exportToPDF() {
            if (!USER) { showToast("請先登入", true); return; }
            try {
                showLoadingBlocking("產生 PDF 報表...");
                await loadMonthData(currentYear, currentMonth);
                const effectiveRows = currentTableData.map(getEffectiveRow);
                const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
                const userEmail = auth.currentUser?.email || USER;
                const startDateStr = `${currentYear}-${(currentMonth + 1).toString().padStart(2, '0')}-01`;
                const endDateStr = `${currentYear}-${(currentMonth + 1).toString().padStart(2, '0')}-${String(totalDays).padStart(2, '0')}`;

                const formatDateForDisplay = (dateStr) => {
                    const [year, m, d] = dateStr.split('-');
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    return `${String(parseInt(d, 10)).padStart(2, '0')}-${monthNames[parseInt(m, 10) - 1]}-${year}`;
                };

                let totalChargeable = 0;
                let totalVacation = 0;
                let totalSatPub = 0;
                let tableRowsHtml = '';

                for (let d = 1; d <= totalDays; d++) {
                    const row = effectiveRows.find(r => parseInt(r.date.split('-')[2], 10) === d);
                    let chargeableDay = 0;
                    let vacation = 0;
                    let satPub = 0;

                    if (row) {
                        const isWeekend = row.weekday === '週六' || row.weekday === '週日';
                        const isPublic = row.holidayType === 'public';
                        const isSpecial = row.holidayType === 'special';
                        const fullDayOff = row.holidayType === 'full-day-off';
                        const halfDayOff = (row.holidayType === 'am-off' || row.holidayType === 'pm-off');

                        const hasMorning = row.times.time1 && row.times.time2;
                        const hasAfternoon = row.times.time3 && row.times.time4;

                        if (hasMorning && hasAfternoon) chargeableDay = 1;
                        else if (hasMorning || hasAfternoon) chargeableDay = 0.5;

                        if (isWeekend || isPublic || isSpecial) {
                            satPub = 1;
                            chargeableDay = 0;
                        } else if (fullDayOff) {
                            vacation = 1;
                            chargeableDay = 0;
                        } else if (halfDayOff) {
                            vacation = 0.5;
                            chargeableDay = 0.5;
                        }

                        totalChargeable += chargeableDay;
                        totalVacation += vacation;
                        totalSatPub += satPub;
                    }

                    tableRowsHtml += `
                        <tr>
                            <td>${d}</td>
                            <td>${chargeableDay}</td>
                            <td>0</td>
                            <td>0</td>
                            <td>${vacation}</td>
                            <td>${satPub}</td>
                            <td>${row?.remark || ''}</td>
                        </tr>`;
                }

                await hideLoadingBlocking();

                const printWin = window.open('', '_blank', 'width=900,height=1100');
                if (!printWin) {
                    showToast("請允許瀏覽器開啟彈出視窗以列印 PDF", true);
                    return;
                }

                printWin.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>T26 Timesheet_${currentYear}.${(currentMonth + 1).toString().padStart(2, '0')}</title>
                        <style>
                            body { font-family: "Courier New", Courier, monospace; font-size: 12px; color: #000; padding: 20px; }
                            h2 { text-align: center; margin-bottom: 12px; font-size: 16px; }
                            .meta-table, .ts-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
                            .meta-table td { padding: 4px 6px; border: 1px solid #000; }
                            .ts-table th, .ts-table td { border: 1px solid #000; padding: 3px 6px; text-align: center; }
                            .ts-table th { background: #f2f2f2; }
                            @media print { @page { size: A4 portrait; margin: 10mm; } }
                        </style>
                    </head>
                    <body>
                        <h2>MONTHLY TIMESHEET (T26)</h2>
                        <table class="meta-table">
                            <tr><td><strong>Contractor:</strong> IT Solutions Ltd.</td><td><strong>Staff Category:</strong> CAP</td></tr>
                            <tr><td><strong>Staff Name:</strong> Mak Chun Chi (${userEmail})</td><td><strong>Department / Post:</strong> Geophysics, Time and Marine Meteor / D2</td></tr>
                            <tr><td><strong>Period From:</strong> ${formatDateForDisplay(startDateStr)}</td><td><strong>Period To:</strong> ${formatDateForDisplay(endDateStr)}</td></tr>
                        </table>
                        <table class="ts-table">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Chargeable Day</th>
                                    <th>Chargeable Hour</th>
                                    <th>Training</th>
                                    <th>Vacation</th>
                                    <th>Sat / Pub Holiday</th>
                                    <th>Others / Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRowsHtml}
                                <tr style="font-weight:bold;background:#f2f2f2;">
                                    <td>Total</td>
                                    <td>${totalChargeable}</td>
                                    <td>0</td>
                                    <td>0</td>
                                    <td>${totalVacation}</td>
                                    <td>${totalSatPub}</td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                        <table class="meta-table">
                            <tr><td><strong>Certifying Officer:</strong> Mr. CHAN Wai Soen (SO(D)21)</td><td><strong>Date:</strong> ${formatDateForDisplay(new Date().toISOString().split('T')[0])}</td></tr>
                        </table>
                        <script>window.onload = function() { window.print(); };<\/script>
                    </body>
                    </html>
                `);
                printWin.document.close();
            } catch (e) {
                await hideLoadingBlocking();
                showToast("產生 PDF 失敗：" + e.message, true);
            }
        }

        // ========== Toolbar & Pending Actions ==========
        consentBtn.addEventListener('click', async () => {
            const res = await Swal.fire({
                title: '啟用雲端儲存',
                text: '同意將您的打卡時間與工時統計儲存至 Firebase Realtime Database？',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '同意並啟用',
                cancelButtonText: '取消'
            });
            if (res.isConfirmed) {
                userConsented = true;
                sessionStorage.setItem('userConsented', 'true');
                updateToolbarState();
                showToast('已啟用雲端儲存');
            }
        });

        refreshBtn.addEventListener('click', () => {
            pendingChanges.clear();
            updatePendingBar();
            refreshAll();
        });

        exportCsvBtn.addEventListener('click', exportToCSV);
        exportPdfBtn.addEventListener('click', exportToPDF);

        savePendingBtn.addEventListener('click', async () => {
            if (!USER || !userConsented) {
                showToast('請先點擊上方「🔒 同意並啟用儲存」', true);
                return;
            }
            const monthStr = (currentMonth + 1).toString().padStart(2, '0');
            await withBlockingLoading(async () => {
                for (const [dateStr, change] of pendingChanges.entries()) {
                    const dayStr = dateStr.split('-')[2];
                    const path = `timesheet/${USER}/${currentYear}/${monthStr}/${dayStr}`;
                    await set(ref(db, path), {
                        time1: change.times.time1 || null,
                        time2: change.times.time2 || null,
                        time3: change.times.time3 || null,
                        time4: change.times.time4 || null,
                        isAmOff: !!change.isAmOff,
                        isPmOff: !!change.isPmOff,
                        remark: change.remark || null,
                        updatedAt: new Date().toISOString()
                    });
                }
                pendingChanges.clear();
                updatePendingBar();
                await refreshAll();
            }, '正在儲存修改至雲端...');
            showToast('所有修改已儲存');
        });

        cancelPendingBtn.addEventListener('click', () => {
            pendingChanges.clear();
            updatePendingBar();
            renderTableOnly();
            showToast('已取消未儲存的修改');
        });

        // ========== Auth Handlers ==========
        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            if (!email || !pass) { showToast('請輸入電郵與密碼', true); return; }
            try {
                await withBlockingLoading(() => signInWithEmailAndPassword(auth, email, pass), '正在登入...');
            } catch (e) {
                showToast('登入失敗：' + e.message, true);
            }
        });

        document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            if (!email || !pass) { showToast('請輸入電郵與密碼', true); return; }
            try {
                await withBlockingLoading(() => createUserWithEmailAndPassword(auth, email, pass), '正在建立帳號...');
                showToast('註冊成功並已自動登入');
            } catch (e) {
                showToast('註冊失敗：' + e.message, true);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            pendingChanges.clear();
            updatePendingBar();
            showToast('已登出系統');
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                isAuthenticated = true;
                USER = user.uid;
                userInfoSpan.textContent = user.email || user.uid;
                statusDot.className = 'status-dot';
                statusText.textContent = '已連線';
                logoutBtn.style.display = 'inline-flex';
                loginOverlay.style.display = 'none';
                updateToolbarState();
                renderTabs();
                await refreshAll();
            } else {
                isAuthenticated = false;
                USER = null;
                userInfoSpan.textContent = '未登入';
                statusDot.className = 'status-dot off';
                statusText.textContent = '未登入';
                logoutBtn.style.display = 'none';
                loginOverlay.style.display = 'flex';
                updateToolbarState();
                renderTabs();
                tableContainer.innerHTML = '<div class="empty-state">🔐 請先登入您的帳號以載入工時表</div>';
            }
        });
    </script>
</body>

</html>
